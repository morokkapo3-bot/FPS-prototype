<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FPS プロトタイプ</title>
<style>
/* 単一の暗い世界観のゲーム画面。全色を明示して、どのホスト背景でも同じ見た目にする */
:root{--bg:#10141a;--fg:#e8ecf1;--hp:#5fd35f;--st:#4cc3ff;--warn:#ff8844;--head:#ffcc22;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;font-size:14px}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:#fff;opacity:.9}
#hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:2px solid #f44;transform:rotate(45deg);opacity:0;transition:opacity .15s}
#dmg{position:absolute;inset:0;background:radial-gradient(transparent 38%,rgba(255,0,0,.6));opacity:0;transition:opacity .35s}
#ammo{position:absolute;right:20px;bottom:20px;font-size:36px;font-weight:700;text-shadow:0 0 4px #000}
#ammo small{font-size:18px;opacity:.8}
#info{position:absolute;left:20px;bottom:20px;text-shadow:0 0 4px #000;line-height:1.5;font-size:13px}
.bar{width:180px;height:9px;background:#2a3038;margin:2px 0 6px;border-radius:2px;overflow:hidden}
.bar>div{height:100%;width:100%}
#hp{background:var(--hp)}
#st{background:var(--st)}
#msg{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-size:20px;text-shadow:0 0 4px #000}
#deadmsg{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-size:32px;font-weight:700;color:#ff6655;text-shadow:0 0 6px #000;text-align:center;white-space:nowrap}
#score{position:absolute;right:20px;top:16px;text-shadow:0 0 4px #000;text-align:right;line-height:1.6}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;line-height:1.9;padding:16px;box-sizing:border-box}
#ov h1{margin:0 0 8px}
</style>
<div id="hud">
  <div id="dmg"></div>
  <div id="cross"><i style="left:-10px;top:-1px;width:7px;height:2px"></i><i style="left:3px;top:-1px;width:7px;height:2px"></i><i style="left:-1px;top:-10px;width:2px;height:7px"></i><i style="left:-1px;top:3px;width:2px;height:7px"></i></div>
  <div id="hit"></div>
  <div id="msg"></div>
  <div id="deadmsg"></div>
  <div id="score"><div id="kills">KILL 0</div><div id="deaths">DEATH 0</div></div>
  <div id="info"><div id="stance"></div><div>HP <span id="hptxt">100</span></div><div class="bar"><div id="hp"></div></div><div>STAMINA</div><div class="bar"><div id="st"></div></div></div>
  <div id="ammo"><span id="mag">30</span> <small>/ <span id="res">90</span></small></div>
</div>
<div id="ov"><div><h1>クリックで開始</h1>
WASD 移動 / マウス 視点 / 左クリック 射撃 / 右クリック ADS<br>
Space ジャンプ / R リロード / Shift ダッシュ / C しゃがみ / Z 伏せ / Esc メニュー<br>
頭部 80 ダメージ・胴体 10 ダメージ。COM は遮蔽から 4 秒おきに顔を出して撃ってきます。<br>
<small>カーソルがロックされない環境ではマウス移動だけで視点が動きます</small></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fb4d9);scene.fog=new THREE.Fog(0x8fb4d9,20,60);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,100);cam.rotation.order='YXZ';scene.add(cam);
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,.9));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(10,20,5);scene.add(sun);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

// ---- Map ----
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({color:0x6b7b5a}));
floor.rotation.x=-Math.PI/2;scene.add(floor);scene.add(new THREE.GridHelper(40,40,0x444444,0x555555));
const walls=[],targets=[],wallMeshes=[];
function box(x,z,w,d,h,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));
 m.position.set(x,h/2,z);scene.add(m);const o={x,z,w,d,h,m};walls.push(o);targets.push(m);wallMeshes.push(m);return o}
box(0,-20,40,1,4,0x777777);box(0,20,40,1,4,0x777777);box(-20,0,1,40,4,0x777777);box(20,0,1,40,4,0x777777);
[[-6,-4,3,3,1.5],[6,-8,2,2,1.2],[0,-12,8,.6,2.5],[-10,-12,2,2,2],[9,2,3,3,1.5],[-4,6,6,.6,2.5],[12,-14,2,2,1.5]]
 .forEach(a=>box(a[0],a[1],a[2],a[3],a[4],0x9a7b52));

// ---- Player ----
const START={x:0,z:14};
const P={x:START.x,z:START.z,y:0,vx:0,vz:0,vy:0,ground:true,yaw:0,pitch:0,eye:1.7,stance:0,stamina:100,sprint:false,exhaust:false,r:.4,
 hp:100,dead:0,bobPh:0,bobA:0,dip:0,roll:0};
const STANCE=[{n:'立ち',h:1.7,s:4.5},{n:'しゃがみ',h:1.1,s:2.2},{n:'伏せ',h:.55,s:1.0}];
const W={mag:30,res:90,max:30,interval:.1,cd:0,reloading:false,rt:0,rdur:0,applied:false,recY:0,recX:0,ads:0,spread:0};
const keys={};let mouseL=false,mouseR=false,locked=false,started=false,fallback=false;
const SENS=.0022,JUMP_V=7,GRAV=22;
let kills=0,deaths=0,dmgFx=0;

// gun model
const gun=new THREE.Group();
const gb=new THREE.Mesh(new THREE.BoxGeometry(.07,.09,.55),new THREE.MeshLambertMaterial({color:0x222222}));
const gm=new THREE.Mesh(new THREE.BoxGeometry(.06,.16,.08),new THREE.MeshLambertMaterial({color:0x333333}));gm.position.set(0,-.1,.05);
const flash=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.12),new THREE.MeshBasicMaterial({color:0xffcc44}));flash.position.z=-.34;flash.visible=false;
gun.add(gb,gm,flash);cam.add(gun);

// ---- Audio ----
let ac;function sfx(freq,dur,vol){try{ac=ac||new AudioContext();const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);n.buffer=b;
 const f=ac.createBiquadFilter();f.frequency.value=freq;const g=ac.createGain();g.gain.value=vol;n.connect(f).connect(g).connect(ac.destination);n.start()}catch(e){}}

// ---- Tracers ----
const tracers=[];
function addTracer(a,b,color){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color}));scene.add(l);tracers.push({l,t:.06})}

// ---- Enemies (COM bots) ----
function labelTex(){const c=document.createElement('canvas');c.width=128;c.height=32;const x=c.getContext('2d');
 x.font='bold 22px sans-serif';x.fillStyle='#fff';x.textAlign='center';x.fillText('COM',64,24);return new THREE.CanvasTexture(c)}
const bots=[];
function mkBot(cover,delay){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(.7,1.4,.4),new THREE.MeshLambertMaterial({color:0xb03030}));body.position.y=.7;
 const head=new THREE.Mesh(new THREE.BoxGeometry(.35,.35,.35),new THREE.MeshLambertMaterial({color:0xd08060}));head.position.y=1.6;
 const bg=new THREE.Mesh(new THREE.BoxGeometry(.08,.1,.5),new THREE.MeshLambertMaterial({color:0x222222}));bg.position.set(.25,1.15,.45);
 const mf=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),new THREE.MeshBasicMaterial({color:0xffaa33}));mf.position.set(.25,1.15,.78);mf.visible=false;
 g.add(body,head,bg,mf);scene.add(g);
 // health bar (billboard)
 const bar=new THREE.Group();
 const bb=new THREE.Mesh(new THREE.PlaneGeometry(1,.1),new THREE.MeshBasicMaterial({color:0x222222}));
 const bf=new THREE.Mesh(new THREE.PlaneGeometry(1,.1),new THREE.MeshBasicMaterial({color:0x5fd35f}));bf.position.z=.01;
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex(),transparent:true}));sp.scale.set(1,.25,1);sp.position.y=.22;
 bar.add(bb,bf,sp);scene.add(bar);
 const b={g,body,head,mf,bar,bf,cover,hp:100,flash:0,dead:0,state:'hide',cycle:delay,side:1,shots:0,fireT:0,after:0,peekT:0,replan:0,cool:0,nt:0,nudge:1,fleeT:0,
  hidePt:new THREE.Vector3(),peekPt:new THREE.Vector3(),muz:0};
 body.userData={bot:b,head:false};head.userData={bot:b,head:true};
 targets.push(body,head);bots.push(b);
 planCover(b);g.position.copy(b.hidePt);g.scale.y=.62;return b}
function planFor(c,side){
 let dx=c.x-P.x,dz=c.z-P.z;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
 const cl=v=>Math.max(-18.5,Math.min(18.5,v));
 const t=Math.min(dx?c.w/2/Math.abs(dx):1e9,dz?c.d/2/Math.abs(dz):1e9);
 const hide=new THREE.Vector3(cl(c.x+dx*(t+.8)),0,cl(c.z+dz*(t+.8)));
 const px=-dz,pz=dx,s=Math.abs(px)*c.w/2+Math.abs(pz)*c.d/2+.9;
 const peek=new THREE.Vector3(cl(hide.x+px*side*s),0,cl(hide.z+pz*side*s));
 return{hide,peek}}
function planCover(b){const r=planFor(b.cover,b.side);b.hidePt.copy(r.hide);b.peekPt.copy(r.peek)}
mkBot(walls[4],0.5);   // box at (-6,-4)
mkBot(walls[8],2.5);   // box at (9,2)

const BOT_SPEED=4.5,FLEE_SPEED=6.3,FLEE_DIST=4.5; // 通常は従来(6)の75%、至近距離では走って逃げる
function aimPt(){return new THREE.Vector3(P.x,P.y+P.eye*.5,P.z)} // 胴体狙い
function colBot(nx,nz,ox,oz){
 for(const w of walls){const hx=w.w/2+.4,hz=w.d/2+.4;
  if(Math.abs(nx-w.x)<hx&&Math.abs(nz-w.z)<hz){
   if(Math.abs(ox-w.x)>=hx)nx=ox;else if(Math.abs(oz-w.z)>=hz)nz=oz;else{nx=ox;nz=oz}}}
 return[nx,nz]}
function moveBot(b,p,sp,dt){
 const g=b.g,dx=p.x-g.position.x,dz=p.z-g.position.z,d=Math.hypot(dx,dz);
 if(d<1e-3)return d;
 const step=Math.min(d,sp*dt);let ux=dx/d,uz=dz/d;
 if(b.nt>0){b.nt-=dt;const k=b.nudge,tx=ux,tz=uz;ux=-tz*k*.9+tx*.3;uz=tx*k*.9+tz*.3;const l=Math.hypot(ux,uz);ux/=l;uz/=l}
 const ox=g.position.x,oz=g.position.z;
 const [nx,nz]=colBot(ox+ux*step,oz+uz*step,ox,oz);
 g.position.x=nx;g.position.z=nz;
 if(Math.hypot(nx-ox,nz-oz)<step*.4&&step>1e-3&&b.nt<=0){b.nt=.6;b.nudge=Math.random()<.5?-1:1}
 return Math.hypot(p.x-nx,p.z-nz)}
function segDist(ax,az,bx,bz,px,pz){const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz||1;
 const t=Math.max(0,Math.min(1,((px-ax)*dx+(pz-az)*dz)/l2));return Math.hypot(px-(ax+dx*t),pz-(az+dz*t))}
function pickCover(b){
 const g=b.g;let best=null,bs=1e9;
 for(const c of walls.slice(4)){
  if(c===b.cover||bots.some(o=>o!==b&&o.cover===c))continue;
  const h=planFor(c,1).hide;
  if(Math.hypot(h.x-P.x,h.z-P.z)<7)continue;
  if(segDist(g.position.x,g.position.z,h.x,h.z,P.x,P.z)<2.2)continue;
  const db=Math.hypot(h.x-g.position.x,h.z-g.position.z);
  if(db<bs){bs=db;best=c}}
 return best}

const rayB=new THREE.Raycaster();
function hurtPlayer(dmg){if(P.dead>0)return;P.hp=Math.max(0,P.hp-dmg);dmgFx=1;sfx(300,.12,.5);
 if(P.hp<=0){P.dead=3;deaths++;$('deaths').textContent='DEATH '+deaths;mouseL=false}}
function botLOS(o,tp){const d=tp.clone().sub(o),dist=d.length();rayB.set(o,d.normalize());rayB.far=dist;
 return rayB.intersectObjects(wallMeshes,false).length===0}
function botShoot(b){
 b.g.updateMatrixWorld(true);
 const o=b.g.localToWorld(new THREE.Vector3(.25,1.15,.78));
 const dir=aimPt().sub(o);dir.normalize();
 const sp=.03;dir.x+=(Math.random()-.5)*2*sp;dir.y+=(Math.random()-.5)*sp;dir.z+=(Math.random()-.5)*2*sp;dir.normalize();
 rayB.set(o,dir);rayB.far=120;
 const wh=rayB.intersectObjects(wallMeshes,false),tw=wh.length?wh[0].distance:120;
 let t3=Infinity,head=false;const hv=Math.hypot(dir.x,dir.z);
 if(hv>1e-4){const rx=P.x-o.x,rz=P.z-o.z,th=(rx*dir.x+rz*dir.z)/hv,lat=Math.abs(rx*dir.z-rz*dir.x)/hv;
  if(th>0&&lat<.4){const t=th/hv,y=o.y+dir.y*t;if(y>=P.y&&y<=P.y+P.eye+.15){t3=t;head=y>P.y+P.eye-.25}}}
 let end;
 if(t3<tw){end=o.clone().addScaledVector(dir,t3);hurtPlayer(head?80:10)}else end=o.clone().addScaledVector(dir,Math.min(tw,120));
 addTracer(o,end,0xff5533);
 b.mf.visible=true;b.muz=.05;
 sfx(700,.12,.35*Math.min(1,10/Math.max(1,o.distanceTo(cam.position))))}

function updateBots(dt){
 for(const b of bots){const g=b.g;
  if(b.dead>0){b.dead-=dt;if(b.dead<=0){b.dead=0;b.hp=100;g.visible=true;b.bar.visible=true;planCover(b);g.position.copy(b.hidePt);g.scale.y=.62;b.state='hide';b.cycle=0;b.cool=0}continue}
  g.rotation.y=Math.atan2(P.x-g.position.x,P.z-g.position.z);
  b.cycle+=dt;if(b.cool>0)b.cool-=dt;
  if(b.muz>0){b.muz-=dt;if(b.muz<=0)b.mf.visible=false}
  // 至近距離に入られたら、走って別の遮蔽へ
  if(b.state!=='flee'&&b.cool<=0&&P.dead<=0&&Math.hypot(P.x-g.position.x,P.z-g.position.z)<FLEE_DIST){
   const c=pickCover(b);
   if(c){b.cover=c;b.side=Math.random()<.5?-1:1;planCover(b);b.state='flee';b.fleeT=0}}
  if(b.state==='flee'){
   b.fleeT+=dt;const d=moveBot(b,b.hidePt,FLEE_SPEED,dt);
   if(d<.2||b.fleeT>6){b.state='hide';b.cycle=0;b.cool=3}
  }else if(b.state==='hide'){
   moveBot(b,b.hidePt,BOT_SPEED,dt); // 遮蔽位置は固定。ずれていたら戻るだけ
   if(b.cycle>=4&&P.dead<=0){b.state='peek';b.cycle=0;b.shots=4;b.fireT=.15;b.after=0;b.peekT=0}
  }else{
   b.peekT+=dt;
   const d=moveBot(b,b.peekPt,BOT_SPEED,dt);
   if(d<.25&&b.shots>0){b.fireT-=dt;
    if(b.fireT<=0){const o=g.localToWorld(new THREE.Vector3(.25,1.15,.78));
     if(P.dead<=0&&botLOS(o,aimPt())){botShoot(b);b.shots--;b.fireT=.25}else b.fireT=.1}}
   if(b.shots<=0){b.after+=dt;if(b.after>.4)b.state='hide'}
   if(b.peekT>2.8)b.state='hide';
  }
  // しゃがみ(隠れ中) / 立ち(それ以外)
  const ts=b.state==='hide'?.62:1;g.scale.y+=(ts-g.scale.y)*(1-Math.exp(-12*dt));
  if(b.flash>0){b.flash-=dt;b.body.material.emissive.setHex(0xffffff)}else b.body.material.emissive.setHex(0);
  const f=Math.max(0,b.hp)/100;b.bf.scale.x=Math.max(.001,f);b.bf.position.x=-(1-f)/2;b.bf.material.color.setHSL(f*.33,.85,.5);
  b.bar.position.set(g.position.x,g.position.y+1.8*g.scale.y+.35,g.position.z);b.bar.lookAt(cam.position)}}

// ---- Input ----
$('ov').addEventListener('click',()=>{started=true;$('ov').style.display='none';
 try{const p=renderer.domElement.requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(e){}});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;
 if(!locked&&started&&!fallback){$('ov').style.display='flex';started=false}});
document.addEventListener('pointerlockerror',()=>{fallback=true;started=true;$('ov').style.display='none'});
addEventListener('keydown',e=>{if(e.code==='Space')e.preventDefault();if(e.repeat)return;keys[e.code]=true;
 if(P.dead>0)return;
 if(e.code==='KeyR')startReload();
 if(e.code==='KeyC')P.stance=P.stance===1?0:1;
 if(e.code==='KeyZ')P.stance=P.stance===2?0:2;
 if(e.code==='Escape'&&fallback){started=false;$('ov').style.display='flex'}});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{if(!started||(!locked&&!fallback)||P.dead>0)return;
 P.yaw-=e.movementX*SENS*(1-W.ads*.5);
 P.pitch-=e.movementY*SENS*(1-W.ads*.5);
 P.pitch=Math.max(-80*Math.PI/180,Math.min(80*Math.PI/180,P.pitch))});
addEventListener('mousedown',e=>{if(e.button===0)mouseL=true;if(e.button===2)mouseR=true});
addEventListener('mouseup',e=>{if(e.button===0)mouseL=false;if(e.button===2)mouseR=false});
addEventListener('contextmenu',e=>e.preventDefault());

// ---- Reload ----
function startReload(){
 if(W.reloading||W.mag>=W.max||W.res<=0||P.sprint)return;
 W.reloading=true;W.rt=0;W.applied=false;W.rdur=W.mag>0?1.8:2.6;
 $('msg').textContent=W.mag>0?'タクティカルリロード':'ドライリロード';sfx(1500,.08,.3)}
function updateReload(dt){
 if(!W.reloading)return;W.rt+=dt;
 if(!W.applied&&W.rt>=W.rdur*.65){const n=Math.min(W.max-W.mag,W.res);W.mag+=n;W.res-=n;W.applied=true;sfx(2500,.06,.3)}
 if(W.rt>=W.rdur){W.reloading=false;$('msg').textContent=''}}

// ---- Shooting ----
const ray=new THREE.Raycaster();
function showHit(head,kill){const h=$('hit');h.style.borderColor=kill?'#f00':head?'#fc2':'#f44';h.style.opacity=1;clearTimeout(showHit.t);showHit.t=setTimeout(()=>h.style.opacity=0,kill?260:120)}
function shoot(){
 W.mag--;W.cd=W.interval;
 const sp=W.spread;const dir=new THREE.Vector3((Math.random()-.5)*2*sp,(Math.random()-.5)*2*sp,-1).normalize();
 dir.applyQuaternion(cam.quaternion);
 const origin=cam.getWorldPosition(new THREE.Vector3());ray.set(origin,dir);ray.far=100;
 const hits=ray.intersectObjects(targets,false);
 const mp=new THREE.Vector3();flash.getWorldPosition(mp);
 let end=origin.clone().addScaledVector(dir,60),hit=null;
 for(const h of hits){const b=h.object.userData.bot;if(b&&b.dead>0)continue;hit=h;break}
 if(hit){end=hit.point;const ud=hit.object.userData;
  if(ud.bot){const b=ud.bot,dmg=ud.head?80:10;b.hp-=dmg;b.flash=.1;
   if(b.hp<=0){b.dead=3;b.g.visible=false;b.bar.visible=false;kills++;$('kills').textContent='KILL '+kills;showHit(ud.head,true)}
   else showHit(ud.head,false)}
  else{const s=new THREE.Mesh(new THREE.SphereGeometry(.05),new THREE.MeshBasicMaterial({color:0x111111}));s.position.copy(end);scene.add(s);setTimeout(()=>scene.remove(s),4000)}}
 addTracer(mp,end,0xffee88);
 W.recY+=(.012+Math.random()*.004)*(1-W.ads*.3);W.recX+=(Math.random()-.5)*.008;
 flash.visible=true;setTimeout(()=>flash.visible=false,40);sfx(900,.12,.5);gun.position.z+=.04}

// ---- Collision / ground ----
function collide(nx,nz,ox,oz){
 for(const w of walls){if(P.y+.3>=w.h)continue;
  const hx=w.w/2+P.r,hz=w.d/2+P.r;
  if(Math.abs(nx-w.x)<hx&&Math.abs(nz-w.z)<hz){
   if(Math.abs(ox-w.x)>=hx)nx=ox;else if(Math.abs(oz-w.z)>=hz)nz=oz;else{nx=ox;nz=oz}}}
 return[nx,nz]}
function groundAt(x,z,y){let g=0;
 for(const w of walls){if(w.h>y+.3)continue;
  if(Math.abs(x-w.x)<w.w/2+P.r*.8&&Math.abs(z-w.z)<w.d/2+P.r*.8)g=Math.max(g,w.h)}
 return g}

function respawn(){
 P.x=START.x;P.z=START.z;P.y=0;P.vx=P.vz=P.vy=0;P.ground=true;P.hp=100;P.dead=0;P.stance=0;P.yaw=0;P.pitch=0;P.stamina=100;P.exhaust=false;P.roll=0;
 W.mag=W.max;W.res=90;W.reloading=false;W.recX=W.recY=0;W.cd=0;$('msg').textContent='';$('deadmsg').textContent='';
 for(const b of bots){b.state='hide';b.cycle=0}}

// ---- Player update ----
function updatePlayer(dt,clock){
 const st=STANCE[P.stance];
 let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0),iz=(keys.KeyW?1:0)-(keys.KeyS?1:0);
 const len=Math.hypot(ix,iz);if(len>0){ix/=len;iz/=len}
 const want=keys.ShiftLeft&&iz>0&&P.stance===0&&!W.reloading&&!mouseR&&!P.exhaust;
 P.sprint=want&&P.stamina>0;
 if(P.sprint){P.stamina=Math.max(0,P.stamina-25*dt);if(P.stamina<=0)P.exhaust=true}
 else P.stamina=Math.min(100,P.stamina+15*dt);
 if(P.exhaust&&P.stamina>=25)P.exhaust=false;
 // jump
 if(keys.Space&&P.ground){P.vy=JUMP_V;P.ground=false;P.stance=0}
 const speed=STANCE[P.stance].s*(P.sprint?1.7:1)*(W.reloading?.7:1)*(1-W.ads*.35);
 const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
 const tx=(fx*iz+rx*ix)*speed,tz=(fz*iz+rz*ix)*speed;
 const rate=P.ground?(len>0?10:7):1.5;
 const k=1-Math.exp(-rate*dt);P.vx+=(tx-P.vx)*k;P.vz+=(tz-P.vz)*k;
 const [nx,nz]=collide(P.x+P.vx*dt,P.z+P.vz*dt,P.x,P.z);P.x=nx;P.z=nz;
 // vertical
 P.vy-=GRAV*dt;P.y+=P.vy*dt;
 const gy=groundAt(P.x,P.z,P.y);
 if(P.y<=gy){if(!P.ground&&P.vy<-4)P.dip=Math.min(.18,-P.vy*.018);P.y=gy;P.vy=0;P.ground=true}else P.ground=false;
 P.dip*=Math.exp(-9*dt);
 // eye height
 P.eye+=(STANCE[P.stance].h-P.eye)*(1-Math.exp(-10*dt));
 // ADS
 W.ads+=((mouseR&&!P.sprint?1:0)-W.ads)*(1-Math.exp(-12*dt));
 cam.fov=75-30*W.ads;cam.updateProjectionMatrix();
 // spread
 const hv=Math.hypot(P.vx,P.vz);
 W.spread=(.035+.02*hv/4.5+(P.ground?0:.03))*(1-W.ads*.88)*(P.stance?.7:1);
 // fire
 W.cd-=dt;updateReload(dt);
 if(mouseL&&W.cd<=0&&!W.reloading&&!P.sprint){
  if(W.mag>0)shoot();else{W.cd=.3;sfx(3000,.03,.3);startReload()}}
 if(!(mouseL&&W.mag>0)||W.cd>0){const r=1-Math.exp(-7*dt);W.recY-=W.recY*r;W.recX-=W.recX*r}
 // walking shake (vertical bob + sway + roll)
 if(P.ground)P.bobPh+=hv*dt*1.2;
 const target=P.ground?Math.min(1,hv/4):0;P.bobA+=(target-P.bobA)*(1-Math.exp(-10*dt));
 const amp=P.bobA*(P.sprint?1.5:1)*(1-W.ads*.6);
 const by=Math.sin(P.bobPh*2)*.06*amp,bx=Math.cos(P.bobPh)*.04*amp,roll=Math.sin(P.bobPh)*.025*amp,nod=Math.sin(P.bobPh*2)*.006*amp;
 cam.position.set(P.x+Math.cos(P.yaw)*bx,P.y+P.eye+by-P.dip,P.z-Math.sin(P.yaw)*bx);
 cam.rotation.y=P.yaw+W.recX;cam.rotation.x=P.pitch+W.recY+nod;cam.rotation.z=roll;
 // gun pose
 const hip=new THREE.Vector3(.25,-.22,-.5),ads=new THREE.Vector3(0,-.145,-.38);
 const gp=hip.clone().lerp(ads,W.ads);
 let rr=0;if(W.reloading){rr=Math.sin(Math.PI*W.rt/W.rdur)}
 if(P.sprint)rr=Math.max(rr,.6);
 gun.position.x+=(gp.x-gun.position.x)*.3;gun.position.y+=(gp.y-rr*.25-gun.position.y)*.3;gun.position.z+=(gp.z-gun.position.z)*.3;
 gun.rotation.x=rr*.6;gun.rotation.z=P.sprint?.5:0}

function updateDead(dt){
 P.dead-=dt;P.roll+=(1.3-P.roll)*(1-Math.exp(-5*dt));
 cam.position.set(P.x,P.y+.35,P.z);cam.rotation.z=P.roll;cam.rotation.x=-.3;
 $('deadmsg').textContent='撃破された… '+Math.max(0,Math.ceil(P.dead))+' 秒後に復活';
 if(P.dead<=0)respawn()}

// ---- Loop ----
let last=performance.now(),clock=0;
function frame(now){
 requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1e3);last=now;clock+=dt;
 if(started){
  if(P.dead>0)updateDead(dt);else updatePlayer(dt,clock);
  updateBots(dt)}
 for(let i=tracers.length-1;i>=0;i--){tracers[i].t-=dt;if(tracers[i].t<=0){scene.remove(tracers[i].l);tracers.splice(i,1)}}
 dmgFx=Math.max(0,dmgFx-dt*2.2);$('dmg').style.opacity=dmgFx;
 // HUD
 $('mag').textContent=W.mag;$('res').textContent=W.res;
 $('stance').textContent='姿勢: '+STANCE[P.stance].n+(P.ground?'':' (空中)')+(P.sprint?' (ダッシュ)':'')+(W.ads>.5?' / ADS':'');
 $('hptxt').textContent=P.hp;$('hp').style.width=P.hp+'%';$('hp').style.background='hsl('+(P.hp*1.2)+',70%,50%)';
 $('st').style.width=P.stamina+'%';$('st').style.background=P.exhaust?'#ff8844':'#4cc3ff';
 renderer.render(scene,cam)}
requestAnimationFrame(frame);
</script>

</body></html>
