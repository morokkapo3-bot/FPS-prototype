 const step=Math.min(d,sp*dt);let ux=dx/d,uz=dz/d;
 if(b.nt>0){b.nt-=dt;const k=b.nudge,tx=ux,tz=uz;ux=-tz*k*.9+tx*.3;uz=tx*k*.9+tz*.3;const l=Math.hypot(ux,uz);ux/=l;uz/=l}
 const ox=g.position.x,oz=g.position.z;
 const [nx,nz]=colBot(ox+ux*step,oz+uz*step,ox,oz);
 g.position.x=nx;g.position.z=nz;
 if(Math.hypot(nx-ox,nz-oz)<step*.4&&step>1e-3&&b.nt<=0){b.nt=.6;b.nudge=Math.random()<.5?-1:1}
 return Math.hypot(p.x-nx,p.z-nz)}
function segDist(ax,az,bx,bz,px,pz){const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz||1;
 const t=Math.max(0,Math.min(1,((px-ax)*dx+(pz-az)*dz)/l2));return Math.hypot(px-(ax+dx*t),pz-(az+dz*t))}
function pickCover(b){
 const g=b.g,t=botTarget(b);if(!t)return null;
 const tp=targetPoint(b),tx=t.g.position.x,tz=t.g.position.z;
 let best=null,bs=1e9,bestL=null,bsL=1e9;
 for(const c of walls.slice(4)){
  if(c===b.cover||bots.some(o=>o!==b&&o.cover===c))continue;
  const h=planFor(c,1,tp).hide;
  if(Math.hypot(h.x-tx,h.z-tz)<5)continue;
  if(segDist(g.position.x,g.position.z,h.x,h.z,tx,tz)<2.2)continue;
  const db=Math.hypot(h.x-g.position.x,h.z-g.position.z);
  let side=Math.random()<.5?-1:1,los=false;
  for(const sd of [side,-side]){const pk=planFor(c,sd,tp).peek;
   if(botLOS(new THREE.Vector3(pk.x,1.15,pk.z),tp)){side=sd;los=true;break}}
  if(db<bs){bs=db;best={c,side}}
  if(los&&db<bsL){bsL=db;bestL={c,side}}}
 return bestL||best}
// 顔出しを終えて隠れる。4発以上撃って1発も当たっていなければ、別の遮蔽へ移動する
function endPeek(b){
 if(b.miss>=4){const r=pickCover(b);b.miss=0;
  if(r){b.cover=r.c;b.side=r.side;planCover(b);b.state='flee';b.fleeT=0;return}}
 b.state='hide'}

const rayB=new THREE.Raycaster();
function hurtPlayer(dmg){if(P.dead>0)return;P.hp=Math.max(0,P.hp-dmg);dmgFx=1;sfx(300,.12,.5);
 if(P.hp<=0){P.dead=3;deaths++;$('deaths').textContent='DEATH '+deaths;mouseL=false}}
function botLOS(o,tp){const d=tp.clone().sub(o),dist=d.length();rayB.set(o,d.normalize());rayB.far=dist;
 return rayB.intersectObjects(wallMeshes,false).length===0}
function botShoot(b){
 const target=botTarget(b);if(!target)return;
 scene.updateMatrixWorld(true);b.g.updateMatrixWorld(true);
 const o=b.g.localToWorld(new THREE.Vector3(.25,1.15,.78));
 const aim=targetPoint(b),dir=aim.clone().sub(o).normalize();
 const sp=.035;dir.x+=(Math.random()-.5)*2*sp;dir.y+=(Math.random()-.5)*sp;dir.z+=(Math.random()-.5)*2*sp;dir.normalize();
 rayB.set(o,dir);rayB.far=120;
 const hits=rayB.intersectObjects(targets,false);
 let end=o.clone().addScaledVector(dir,60),hitBot=false;
 for(const h of hits){
  const victim=h.object.userData.bot;
  if(!victim){end=h.point;break}
  if(victim===b||victim.dead>0)continue;
  end=h.point;hitBot=true;
  victim.hp-=h.object.userData.head?80:10;victim.flash=.12;
  if(victim.hp<=0){
   victim.dead=3;victim.deaths++;b.kills++;
   victim.g.visible=false;victim.bar.visible=false;
   updateComScore();
  }
  break;
 }
 if(hitBot)b.miss=0;else b.miss++;
 addTracer(o,end,0xff5533);
 b.mf.visible=true;b.muz=.05;
 sfx(700,.12,.25)}
function updateComScore(){
 const a=bots[0],b=bots[1];
 if(a)$('com1score').textContent=`COM 1　K ${a.kills} / D ${a.deaths}`;
 if(b)$('com2score').textContent=`COM 2　K ${b.kills} / D ${b.deaths}`;
}
updateComScore();

function updateBots(dt){
 for(const b of bots){const g=b.g;
  if(b.dead>0){b.dead-=dt;if(b.dead<=0){b.dead=0;b.hp=100;g.visible=true;b.bar.visible=true;planCover(b);g.position.copy(b.hidePt);g.scale.y=.62;b.state='hide';b.cycle=0;b.cool=0;b.miss=0}continue}
  const target=botTarget(b);
  if(!target)continue;
  const tp=targetPoint(b);
  g.rotation.y=Math.atan2(target.g.position.x-g.position.x,target.g.position.z-g.position.z);
  b.cycle+=dt;if(b.cool>0)b.cool-=dt;
  if(b.muz>0){b.muz-=dt;if(b.muz<=0)b.mf.visible=false}
  // 相手に接近しすぎたら、別の遮蔽へ移動する
  if(b.state!=='flee'&&b.cool<=0&&Math.hypot(target.g.position.x-g.position.x,target.g.position.z-g.position.z)<FLEE_DIST){
   const r=pickCover(b);
   if(r){b.cover=r.c;b.side=r.side;planCover(b);b.state='flee';b.fleeT=0;b.miss=0}}
  if(b.state==='flee'){
   b.fleeT+=dt;const d=moveBot(b,b.hidePt,FLEE_SPEED,dt);
   if(d<.2||b.fleeT>6){b.state='hide';b.cycle=0;b.cool=3}
  }else if(b.state==='hide'){
   moveBot(b,b.hidePt,BOT_SPEED,dt); // 遮蔽位置は固定。ずれていたら戻るだけ
   if(b.cycle>=4){b.state='peek';b.cycle=0;b.shots=4;b.fireT=0;b.seenT=0;b.after=0;b.peekT=0}
  }else{
   b.peekT+=dt;
   const d=moveBot(b,b.peekPt,BOT_SPEED,dt);
   if(d<.25&&b.shots>0){
    const o=g.localToWorld(new THREE.Vector3(.25,1.15,.78));
    const los=target.dead<=0&&botLOS(o,tp);
    if(los)b.seenT+=dt;
    b.fireT-=dt;
    if(los&&b.seenT>=PEEK_DELAY&&b.fireT<=0){botShoot(b);b.shots--;b.fireT=.25}}
   if(b.shots<=0){b.after+=dt;if(b.after>.4)endPeek(b)}
   else if(b.peekT>2.8){if(b.shots>=4)b.miss=4;endPeek(b)} // 1発も撃てないまま時間切れ(射線が通らない)も不発扱い
  }
  // しゃがみ(隠れ中) / 立ち(それ以外)
  const ts=b.state==='hide'?.62:1;g.scale.y+=(ts-g.scale.y)*(1-Math.exp(-12*dt));
  if(b.flash>0){b.flash-=dt;b.body.material.emissive.setHex(0xffffff)}else b.body.material.emissive.setHex(0);
  const f=Math.max(0,b.hp)/100;b.bf.scale.x=Math.max(.001,f);b.bf.position.x=-(1-f)/2;b.bf.material.color.setHSL(f*.33,.85,.5);
  b.bar.position.set(g.position.x,g.position.y+1.8*g.scale.y+.35,g.position.z);b.bar.lookAt(cam.position)}}

// ---- Input ----
$('ov').addEventListener('click',()=>{if(roundOver)startRound();started=true;$('ov').style.display='none';
 try{const p=renderer.domElement.requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(e){}});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;
 if(!locked&&started&&!fallback){$('ov').style.display='flex';started=false}});
document.addEventListener('pointerlockerror',()=>{fallback=true;started=true;$('ov').style.display='none'});
addEventListener('keydown',e=>{if(e.code==='Space')e.preventDefault();if(e.repeat)return;keys[e.code]=true;
 if(P.dead>0)return;
 if(e.code==='KeyR')startReload();
 if(e.code==='KeyC')P.stance=P.stance===1?0:1;
 if(e.code==='KeyZ')P.stance=P.stance===2?0:2;
 if(e.code==='Escape'&&fallback){started=false;$('ov').style.display='flex'}});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{if(!started||(!locked&&!fallback)||P.dead>0)return;
 P.yaw-=e.movementX*SENS*(1-W.ads*.5);
 P.pitch-=e.movementY*SENS*(1-W.ads*.5);
 P.pitch=Math.max(-80*Math.PI/180,Math.min(80*Math.PI/180,P.pitch))});
addEventListener('mousedown',e=>{if(e.button===0)mouseL=true;if(e.button===2)mouseR=true});
addEventListener('mouseup',e=>{if(e.button===0)mouseL=false;if(e.button===2)mouseR=false});
addEventListener('contextmenu',e=>e.preventDefault());

// ---- Reload ----
function startReload(){
 if(W.reloading||W.mag>=W.max||W.res<=0||P.sprint)return;
 W.reloading=true;W.rt=0;W.applied=false;W.rdur=W.mag>0?1.8:2.6;
 $('msg').textContent=W.mag>0?'タクティカルリロード':'ドライリロード';sfx(1500,.08,.3)}
function updateReload(dt){
 if(!W.reloading)return;W.rt+=dt;
 if(!W.applied&&W.rt>=W.rdur*.65){const n=Math.min(W.max-W.mag,W.res);W.mag+=n;W.res-=n;W.applied=true;sfx(2500,.06,.3)}
 if(W.rt>=W.rdur){W.reloading=false;$('msg').textContent=''}}

// ---- Shooting ----
const ray=new THREE.Raycaster();
function showHit(head,kill){const h=$('hit');h.style.borderColor=kill?'#f00':head?'#fc2':'#f44';h.style.opacity=1;clearTimeout(showHit.t);showHit.t=setTimeout(()=>h.style.opacity=0,kill?260:120)}
function shoot(){
 W.mag--;W.cd=W.interval;
 const sp=W.spread;const dir=new THREE.Vector3((Math.random()-.5)*2*sp,(Math.random()-.5)*2*sp,-1).normalize();
 dir.applyQuaternion(cam.quaternion);
 const origin=cam.getWorldPosition(new THREE.Vector3());ray.set(origin,dir);ray.far=100;
 const hits=ray.intersectObjects(targets,false);
 const mp=new THREE.Vector3();flash.getWorldPosition(mp);
 let end=origin.clone().addScaledVector(dir,60),hit=null;
 for(const h of hits){const b=h.object.userData.bot;if(b&&b.dead>0)continue;hit=h;break}
 if(hit){end=hit.point;const ud=hit.object.userData;
  if(ud.bot){const b=ud.bot,dmg=ud.head?80:10;b.hp-=dmg;b.flash=.1;
   if(b.hp<=0){b.dead=3;b.g.visible=false;b.bar.visible=false;kills++;$('kills').textContent='KILL '+kills;showHit(ud.head,true)}
   else showHit(ud.head,false)}
  else{const s=new THREE.Mesh(new THREE.SphereGeometry(.05),new THREE.MeshBasicMaterial({color:0x111111}));s.position.copy(end);scene.add(s);setTimeout(()=>scene.remove(s),4000)}}
 addTracer(mp,end,0xffee88);
 W.recY+=(.012+Math.random()*.004)*(1-W.ads*.3);W.recX+=(Math.random()-.5)*.008;
 flash.visible=true;setTimeout(()=>flash.visible=false,40);sfx(900,.12,.5);gun.position.z+=.04}

// ---- Collision / ground ----
function collide(nx,nz,ox,oz){
 for(const w of walls){if(P.y+.3>=w.h)continue;
  const hx=w.w/2+P.r,hz=w.d/2+P.r;
  if(Math.abs(nx-w.x)<hx&&Math.abs(nz-w.z)<hz){
   if(Math.abs(ox-w.x)>=hx)nx=ox;else if(Math.abs(oz-w.z)>=hz)nz=oz;else{nx=ox;nz=oz}}}
 return[nx,nz]}
function groundAt(x,z,y){let g=0;
 for(const w of walls){if(w.h>y+.3)continue;
  if(Math.abs(x-w.x)<w.w/2+P.r*.8&&Math.abs(z-w.z)<w.d/2+P.r*.8)g=Math.max(g,w.h)}
 return g}

function respawn(){
 P.x=START.x;P.z=START.z;P.y=0;P.vx=P.vz=P.vy=0;P.ground=true;P.hp=100;P.dead=0;P.stance=0;P.yaw=0;P.pitch=0;P.stamina=100;P.exhaust=false;P.roll=0;
 W.mag=W.max;W.res=90;W.reloading=false;W.recX=W.recY=0;W.cd=0;$('msg').textContent='';$('deadmsg').textContent='';
 for(const b of bots){b.state='hide';b.cycle=0;b.miss=0}}

// ---- Player update ----
function updatePlayer(dt,clock){
 const st=STANCE[P.stance];
 let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0),iz=(keys.KeyW?1:0)-(keys.KeyS?1:0);
 const len=Math.hypot(ix,iz);if(len>0){ix/=len;iz/=len}
 const want=keys.ShiftLeft&&iz>0&&P.stance===0&&!W.reloading&&!mouseR&&!P.exhaust;
 P.sprint=want&&P.stamina>0;
 if(P.sprint){P.stamina=Math.max(0,P.stamina-25*dt);if(P.stamina<=0)P.exhaust=true}
 else P.stamina=Math.min(100,P.stamina+15*dt);
 if(P.exhaust&&P.stamina>=25)P.exhaust=false;
 // jump
 if(keys.Space&&P.ground){P.vy=JUMP_V;P.ground=false;P.stance=0}
 const speed=STANCE[P.stance].s*(P.sprint?1.7:1)*(W.reloading?.7:1)*(1-W.ads*.35);
 const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
 const tx=(fx*iz+rx*ix)*speed,tz=(fz*iz+rz*ix)*speed;
 const rate=P.ground?(len>0?10:7):1.5;
 const k=1-Math.exp(-rate*dt);P.vx+=(tx-P.vx)*k;P.vz+=(tz-P.vz)*k;
 const [nx,nz]=collide(P.x+P.vx*dt,P.z+P.vz*dt,P.x,P.z);P.x=nx;P.z=nz;
 // vertical
 P.vy-=GRAV*dt;P.y+=P.vy*dt;
 const gy=groundAt(P.x,P.z,P.y);
 if(P.y<=gy){if(!P.ground&&P.vy<-4)P.dip=Math.min(.18,-P.vy*.018);P.y=gy;P.vy=0;P.ground=true}else P.ground=false;
 P.dip*=Math.exp(-9*dt);
 // eye height
 P.eye+=(STANCE[P.stance].h-P.eye)*(1-Math.exp(-10*dt));
 // ADS
 W.ads+=((mouseR&&!P.sprint?1:0)-W.ads)*(1-Math.exp(-12*dt));
 cam.fov=75-30*W.ads;cam.updateProjectionMatrix();
 // spread
 const hv=Math.hypot(P.vx,P.vz);
 W.spread=(.035+.02*hv/4.5+(P.ground?0:.03))*(1-W.ads*.88)*(P.stance?.7:1);
 // 観戦モード：プレイヤーは攻撃しない
 W.cd-=dt;updateReload(dt);mouseL=false;
 if(!(mouseL&&W.mag>0)||W.cd>0){const r=1-Math.exp(-7*dt);W.recY-=W.recY*r;W.recX-=W.recX*r}
 // walking shake (vertical bob + sway + roll)
 if(P.ground)P.bobPh+=hv*dt*1.2;
 const target=P.ground?Math.min(1,hv/4):0;P.bobA+=(target-P.bobA)*(1-Math.exp(-10*dt));
 const amp=P.bobA*(P.sprint?1.5:1)*(1-W.ads*.6);
 const by=Math.sin(P.bobPh*2)*.06*amp,bx=Math.cos(P.bobPh)*.04*amp,roll=Math.sin(P.bobPh)*.025*amp,nod=Math.sin(P.bobPh*2)*.006*amp;
 cam.position.set(P.x+Math.cos(P.yaw)*bx,P.y+P.eye+by-P.dip,P.z-Math.sin(P.yaw)*bx);
 cam.rotation.y=P.yaw+W.recX;cam.rotation.x=P.pitch+W.recY+nod;cam.rotation.z=roll;
 // gun pose
 const hip=new THREE.Vector3(.19,-.18,-.45),ads=new THREE.Vector3(0,0,-.34);
 const gp=hip.clone().lerp(ads,W.ads);
 let rr=0;if(W.reloading){rr=Math.sin(Math.PI*W.rt/W.rdur)}
 if(P.sprint)rr=Math.max(rr,.6);
 gun.position.x+=(gp.x-gun.position.x)*.3;gun.position.y+=(gp.y-rr*.25-gun.position.y)*.3;gun.position.z+=(gp.z-gun.position.z)*.3;
 gun.rotation.x=rr*.6;gun.rotation.z=P.sprint?.5:0;gun.rotation.y=.05*(1-W.ads)}

function updateDead(dt){
 P.dead-=dt;P.roll+=(1.3-P.roll)*(1-Math.exp(-5*dt));
 cam.position.set(P.x,P.y+.35,P.z);cam.rotation.z=P.roll;cam.rotation.x=-.3;
 $('deadmsg').textContent='撃破された… '+Math.max(0,Math.ceil(P.dead))+' 秒後に復活';
 if(P.dead<=0)respawn()}

// ---- Loop ----
const ROUND_DURATION=300;
let roundLeft=ROUND_DURATION,roundOver=false;
function formatTime(t){t=Math.max(0,Math.ceil(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function startRound(){
 roundLeft=ROUND_DURATION;roundOver=false;
 for(const b of bots){b.kills=0;b.deaths=0;b.hp=100;b.dead=0;b.g.visible=true;b.bar.visible=true;b.state='hide';b.cycle=0;b.cool=0;b.miss=0;b.idleT=0}
 updateComScore();$('roundtime').textContent='残り 05:00';$('spectator').textContent='COM対抗戦・観戦中';
}
let last=performance.now(),clock=0;
function frame(now){
 requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1e3);last=now;clock+=dt;
 if(started&&!roundOver){
  roundLeft=Math.max(0,roundLeft-dt);
  $('roundtime').textContent='残り '+formatTime(roundLeft);
  if(roundLeft<=0){
   roundOver=true;started=false;
   $('spectator').textContent='終了：COM戦の結果';
   $('ov').innerHTML='<div><h1>5分間の戦闘終了</h1><p id="finalscore"></p><p>クリックで再戦</p></div>';
   $('finalscore').textContent=`COM 1：${bots[0].kills} K / ${bots[0].deaths} D　｜　COM 2：${bots[1].kills} K / ${bots[1].deaths} D`;
   $('ov').style.display='flex';
  }else{
   if(P.dead>0)updateDead(dt);else updatePlayer(dt,clock);
   updateBots(dt);
  }
 }
 for(let i=tracers.length-1;i>=0;i--){tracers[i].t-=dt;if(tracers[i].t<=0){scene.remove(tracers[i].l);tracers.splice(i,1)}}
 dmgFx=Math.max(0,dmgFx-dt*2.2);$('dmg').style.opacity=dmgFx;
 // HUD
 $('mag').textContent='観戦';$('res').textContent='COM戦';
 $('stance').textContent='姿勢: '+STANCE[P.stance].n+(P.ground?'':' (空中)')+(P.sprint?' (ダッシュ)':'')+(W.ads>.5?' / ADS':'');
 $('hptxt').textContent=P.hp;$('hp').style.width=P.hp+'%';$('hp').style.background='hsl('+(P.hp*1.2)+',70%,50%)';
 $('st').style.width=P.stamina+'%';$('st').style.background=P.exhaust?'#ff8844':'#4cc3ff';
 renderer.render(scene,cam)}
requestAnimationFrame(frame);
</script>
